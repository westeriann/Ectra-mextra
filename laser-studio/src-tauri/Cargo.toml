[package]
name = "laser-studio"
version = "0.2.0"
description = "Design, program and play virtual laser shows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "laser_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
cpal = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
